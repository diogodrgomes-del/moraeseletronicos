<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moraes Celulares &amp; Eletrônicos</title>
<meta name="description" content="Referência em iPhone e muito mais. Produtos originais, até 12x no cartão e envio para todo o Brasil.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Moraes Celulares &amp; Eletrônicos">
<meta property="og:description" content="Referência em iPhone e muito mais. Fale com a gente no WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<style>
/* ============================================================
   MORAES — link na bio

   A arte não é redesenhada: ela É a página. O arquivo de imagem
   aparece inteiro na tela e, por cima dele, ficam áreas clicáveis
   invisíveis alinhadas com os botões desenhados na arte.

   As posições estão em porcentagem, então continuam certas em
   qualquer tamanho de tela — a arte encolhe, as áreas encolhem junto.
   ============================================================ */
*{ box-sizing: border-box; }

html, body{ height: 100%; }

html{ -webkit-text-size-adjust: 100%; }

body{
  margin: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* preenche as bordas com a própria arte desfocada, em vez de preto chapado */
.fundo{
  position: fixed;
  inset: -6%;
  z-index: 0;
  background-position: center;
  background-size: cover;
  filter: blur(34px) brightness(.34) saturate(115%);
  opacity: 0;
  transition: opacity .4s ease;
}
.fundo.on{ opacity: 1; }

/* ------------------------------------------------------------
   A arte. A caixa tem a proporção exata do arquivo, e as áreas
   clicáveis são posicionadas em % dentro dela — por isso elas
   nunca saem do lugar.
   ------------------------------------------------------------ */
.arte{
  position: relative;
  z-index: 1;
  aspect-ratio: 941 / 1672;
  width: min(100vw, calc(100dvh * 941 / 1672));
  max-height: 100dvh;
}

.arte > img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ------------------------------------------------------------
   Áreas clicáveis — invisíveis em repouso, para não mudar a arte.
   Só acendem de leve quando o dedo encosta ou o teclado foca.
   ------------------------------------------------------------ */
.toque{
  position: absolute;
  display: block;
  border-radius: 3.6%/22%;
  background: transparent;
  transition: background .14s ease, transform .14s ease;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

@media (hover: hover){
  .toque:hover{ background: rgba(255,255,255,.07); }
}

.toque:active{ background: rgba(255,255,255,.11); transform: scale(.985); }

.toque:focus-visible{
  outline: 3px solid #F2A81C;
  outline-offset: 2px;
  background: rgba(242,168,28,.12);
}

/* posições medidas sobre a arte, em % da largura e da altura */
.t-iphone  { left: 17.6%; top: 39.7%; width: 65.3%; height: 9.6%; }
.t-android { left: 17.6%; top: 50.4%; width: 65.3%; height: 9.6%; }
.t-endereco{ left: 17.6%; top: 61.1%; width: 65.3%; height: 8.8%; }
.t-instagram{ left: 29.4%; top: 82.8%; width: 41.9%; height: 6.4%; border-radius: 5%/30%; }

/* ------------------------------------------------------------
   Aviso que só aparece enquanto o arquivo da arte não existe.
   Some sozinho assim que a imagem for colocada em assets/.
   ------------------------------------------------------------ */
.falta{
  position: absolute;
  inset: 0;
  z-index: 2;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 28px 24px;
  text-align: center;
  background: #0A0A0C;
  color: #EDEBE8;
}
body.sem-arte .falta{ display: flex; }
body.sem-arte .arte > img{ display: none; }

.falta h1{
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .02em;
  color: #F2A81C;
}
.falta p{ margin: 0; font-size: 13px; line-height: 1.5; color: #A0978D; max-width: 30ch; }
.falta code{
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  padding: 3px 7px;
  border-radius: 5px;
  background: rgba(242,168,28,.12);
  color: #FFD470;
}
.falta ol{
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 12.5px;
  line-height: 1.45;
  color: #8C867E;
  text-align: left;
  max-width: 32ch;
}
.falta ol li{ padding-left: 20px; position: relative; }
.falta ol li::before{
  content: counter(passo);
  counter-increment: passo;
  position: absolute;
  left: 0;
  font-weight: 700;
  color: #F2A81C;
}
.falta ol{ counter-reset: passo; }

@media (prefers-reduced-motion: reduce){
  *{ transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="fundo" id="fundo" aria-hidden="true"></div>

<div class="arte">

  <img id="arte"
       src="assets/arte.jpg"
       alt="Moraes Celulares e Eletrônicos — Referência em iPhone e muito mais. Produtos originais, até 12x no cartão, envio para todo o Brasil e atendimento especializado.">

  <!-- áreas clicáveis sobre os botões da arte -->
  <a class="toque t-iphone"    id="lk-iphone"    href="#" target="_blank" rel="noopener"
     aria-label="WhatsApp — venda de iPhone"></a>

  <a class="toque t-android"   id="lk-android"   href="#" target="_blank" rel="noopener"
     aria-label="WhatsApp — venda de Android"></a>

  <a class="toque t-endereco"  id="lk-maps"      href="#" target="_blank" rel="noopener"
     aria-label="Nosso endereço — abrir no mapa"></a>

  <a class="toque t-instagram" id="lk-ig"        href="#" target="_blank" rel="noopener"
     aria-label="Instagram da Moraes Celulares e Eletrônicos"></a>

  <!-- visível só enquanto falta o arquivo da arte -->
  <div class="falta">
    <h1>Falta a arte</h1>
    <p>A página está pronta e os botões já estão no lugar. Só falta a imagem.</p>
    <ol>
      <li>Salve a arte como <code>arte.jpg</code></li>
      <li>Coloque na pasta <code>assets/</code> do repositório</li>
      <li>Recarregue — os botões já ficam clicáveis por cima dela</li>
    </ol>
  </div>

</div>

<script>
/* ============================================================
   EDITE AQUI — tudo que muda de verdade está neste bloco.
   Telefones no formato internacional, só dígitos: 55 + DDD + número.
   ============================================================ */
const MORAES = {
  whatsappIphone:  "5543000000000",
  whatsappAndroid: "5543000000000",
  msgIphone:       "Olá! Vim pelo link da bio e quero saber sobre iPhone.",
  msgAndroid:      "Olá! Vim pelo link da bio e quero saber sobre Android.",
  instagram:       "moraeseletronicos",
  mapsUrl:         "https://www.google.com/maps/search/?api=1&query=Moraes+Celulares+e+Eletronicos"
};

/* ---------- daqui para baixo não precisa mexer ---------- */
(function ligarBotoes(){
  const wa = (fone, msg) => "https://wa.me/" + fone + "?text=" + encodeURIComponent(msg);
  const set = (id, href) => {
    const el = document.getElementById(id);
    if (el) el.href = href;
  };
  set("lk-iphone",  wa(MORAES.whatsappIphone,  MORAES.msgIphone));
  set("lk-android", wa(MORAES.whatsappAndroid, MORAES.msgAndroid));
  set("lk-maps",    MORAES.mapsUrl);
  set("lk-ig",      "https://instagram.com/" + MORAES.instagram);
})();

/* Procura a arte em jpg, depois png, depois webp. Achando, usa a mesma
   imagem desfocada para preencher as bordas da tela. */
(function carregarArte(){
  const img = document.getElementById("arte");
  const fundo = document.getElementById("fundo");
  const tentativas = ["assets/arte.jpg", "assets/arte.png", "assets/arte.webp"];
  let i = 0;

  function ok(){
    document.body.classList.remove("sem-arte");
    fundo.style.backgroundImage = 'url("' + img.src + '")';
    fundo.classList.add("on");
  }

  function proxima(){
    i++;
    if (i < tentativas.length) { img.src = tentativas[i]; return; }
    document.body.classList.add("sem-arte");
  }

  img.addEventListener("load",  ok);
  img.addEventListener("error", proxima);

  if (img.complete) { img.naturalWidth > 0 ? ok() : proxima(); }
})();
</script>

</body>
</html>
