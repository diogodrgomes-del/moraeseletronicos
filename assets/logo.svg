<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 418" width="418" height="418" role="img" aria-labelledby="tt">
  <title id="tt">Moraes Celulares &amp; Eletrônicos</title>

  <rect width="418" height="418" fill="#0C0C0C"/>

  <!-- Monograma: M dourado por fora, M cinza por dentro.
       O traço preto sob o cinza abre o vinco onde os dois se cruzam. -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M70 292 L70 102 L209 244 L348 102 L348 292"  stroke="#E9B429" stroke-width="46"/>
    <path d="M131 292 L131 94 L209 212 L287 94 L287 292"  stroke="#0C0C0C" stroke-width="61"/>
    <path d="M131 292 L131 94 L209 212 L287 94 L287 292"  stroke="#757575" stroke-width="46"/>
  </g>

  <!-- Assinatura, sobreposta à base do monograma -->
  <g fill="#FFFFFF" text-anchor="middle"
     font-family="Sora, Manrope, 'Helvetica Neue', Arial, sans-serif">
    <text x="213" y="287" font-size="47" font-weight="700"
          textLength="224" lengthAdjust="spacing">MORAES</text>
    <text x="209" y="326" font-size="20" font-weight="600"
          textLength="360" lengthAdjust="spacing">CELULARES &amp; ELETRÔNICOS</text>
  </g>
</svg>
